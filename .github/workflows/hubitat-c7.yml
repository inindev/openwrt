name: Hubitat C7

on:
  workflow_dispatch:

concurrency:
  group: hubitat-c7-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Free disk space
        run: |
          set -euo pipefail
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /opt/hostedtoolcache \
            /usr/local/share/powershell \
            /usr/share/swift \
            /usr/local/.ghcup
          sudo docker image prune --all --force || true
          df -h

      - name: Install host packages
        run: |
          set -euo pipefail
          sudo apt-get update
          # gcc-multilib is not available on arm64. The host prereq check
          # only needs a native gcc and g++. The FIP signing tool
          # (aml_encrypt) is x86_64-only and runs under qemu-user.
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            clang \
            flex \
            bison \
            g++ \
            gawk \
            gettext \
            git \
            libncurses-dev \
            libssl-dev \
            python3-setuptools \
            rsync \
            swig \
            unzip \
            zlib1g-dev \
            file \
            wget \
            pkg-config \
            qemu-user

      - name: Build image and kernel modules
        env:
          APK_PRIVATE_KEY: ${{ secrets.APK_PRIVATE_KEY }}
          APK_PUBLIC_KEY: ${{ secrets.APK_PUBLIC_KEY }}
        run: .github/workflows/scripts/build-hubitat-c7.sh

      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: hubitat-c7-logs
          path: logs
          if-no-files-found: ignore

      - name: Upload firmware
        uses: actions/upload-artifact@v7
        with:
          name: hubitat-c7-firmware
          path: |
            firmware-bundle/*.tar.gz
            firmware-bundle/*.tar.gz.sha256
          if-no-files-found: error

      - name: Upload kernel module feed
        uses: actions/upload-artifact@v7
        with:
          name: hubitat-c7-kmods
          path: pages-feed
          if-no-files-found: error
